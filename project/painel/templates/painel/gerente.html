<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerente</title>
    <style>
        :root { --ink: #172b4d; --accent: #087f8c; --surface: rgba(255,255,255,.92); }
        * { box-sizing: border-box; }
        body { margin: 0; min-height: 100vh; padding: clamp(18px, 4vw, 56px); color: var(--ink); font-family: Inter, "Segoe UI", sans-serif; background: radial-gradient(circle at 12% 10%, #d7f0ec 0, transparent 32%), linear-gradient(135deg, #f4f7fb, #eaf0f7); }
        h1, h2, h3 { letter-spacing: -.035em; }
        .card, header, main, article, body > form, body > table { background: var(--surface); border: 1px solid rgba(23,43,77,.08); border-radius: 22px; box-shadow: 0 18px 48px rgba(25,48,76,.10); }
        nav { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
        a { color: var(--accent); }
        button, .btn { border-radius: 12px; font-weight: 650; }
        input:not([type=hidden]) { border-radius: 10px; }
        table { width: 100%; border-collapse: separate; border-spacing: 0; overflow: hidden; }
        th { background: #172b4d; color: #fff; }
        th, td { padding: 13px 16px; border-bottom: 1px solid #e8edf3; }
        @media (max-width: 600px) { body { padding: 16px; } }
    </style>
</head>
<body>
    <h1>Gerente</h1>
</body>
</html>
