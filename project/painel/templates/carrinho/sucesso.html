<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#101828">
    <title>Pedido confirmado | Vértice</title>
    <style>
        :root { --ink: #172033; --muted: #667085; --brand: #5267e8; --line: #e8ebf2; }
        * { box-sizing: border-box; }
        body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; color: var(--ink); background: #f7f8fc; font-family: Inter, "Segoe UI", sans-serif; }
        .success-card { width: min(100%, 520px); padding: clamp(30px, 7vw, 56px); background: white; border: 1px solid var(--line); border-radius: 24px; box-shadow: 0 20px 60px rgba(16,24,40,.08); text-align: center; }
        .success-icon { display: grid; width: 72px; height: 72px; place-items: center; margin: 0 auto 24px; color: #16794a; background: #e9f8ef; border-radius: 50%; font-size: 2rem; font-weight: 800; }
        .eyebrow { color: #16794a; font-size: .74rem; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; }
        h1 { margin: 12px 0 10px; font-size: clamp(1.8rem, 5vw, 2.4rem); letter-spacing: -.055em; }
        p { margin: 0; color: var(--muted); line-height: 1.65; }
        .order-number { display: inline-block; margin-top: 18px; padding: 9px 13px; color: #475467; background: #f8f9fc; border-radius: 9px; font-size: .88rem; }
        .button { display: inline-flex; min-height: 46px; align-items: center; justify-content: center; margin-top: 28px; padding: 0 20px; color: white; background: var(--brand); border-radius: 11px; font-weight: 750; text-decoration: none; }
        .button:hover { background: #4054d0; }
    </style>
</head>
<body>
    <main class="success-card">
        <div class="success-icon" aria-hidden="true">✓</div>
        <span class="eyebrow">Pedido confirmado</span>
        <h1>Compra realizada com sucesso!</h1>
        <p>Obrigado por comprar com a Vértice. Seu pedido foi registrado e está pronto para acompanhamento.</p>
        {% if pedido %}
        <span class="order-number">Pedido #{{ pedido.id }}</span>
        {% endif %}
        <br>
        <a class="button" href="{% url 'loja_carrinho' %}">Voltar para a loja</a>
    </main>
</body>
</html>
