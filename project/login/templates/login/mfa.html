<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validação de acesso</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; color: #172b4d; font-family: Inter, "Segoe UI", sans-serif; background: radial-gradient(circle at 15% 15%, #d7f0ec, transparent 34%), linear-gradient(135deg, #f4f7fb, #eaf0f7); }
    main { width: min(100%, 460px); padding: clamp(28px, 6vw, 48px); background: rgba(255,255,255,.94); border: 1px solid #e5ebf2; border-radius: 24px; box-shadow: 0 22px 60px rgba(25,48,76,.13); }
    .eyebrow { color: #087f8c; font-size: .78rem; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(1.7rem, 5vw, 2.2rem); letter-spacing: -.04em; }
    p { color: #62718a; line-height: 1.6; }
    .message { padding: 12px 14px; color: #8b2635; background: #fff0f1; border-radius: 12px; }
    label { display: block; margin: 24px 0 8px; font-weight: 650; }
    input { width: 100%; padding: 14px; border: 1px solid #d9e1ea; border-radius: 12px; font: inherit; font-size: 1.15rem; letter-spacing: .25em; text-align: center; }
    button { width: 100%; margin-top: 18px; padding: 14px; color: white; background: #087f8c; border: 0; border-radius: 12px; font: inherit; font-weight: 700; cursor: pointer; }
    button:hover { background: #066975; }
  </style>
</head>
<body>
<main>
  <span class="eyebrow">Segurança da conta · Etapa 2</span>
  <h1>Confirme seu acesso</h1>
  <p>Um código de 6 dígitos foi enviado para o seu e-mail. Digite-o abaixo:</p>

<!-- Exibe mensagens de código inválido ou expirado. -->
{% if messages %}
  {% for message in messages %}
    <p class="message">{{ message }}</p>
  {% endfor %}
{% endif %}

<!-- O código é enviado à view MFA para validação e uso único. -->
<form method="post">
  {% csrf_token %}
  <label for="code">Código de 6 dígitos</label>
  <input type="text" id="code" name="code" maxlength="6" required placeholder="000000" inputmode="numeric" autocomplete="one-time-code">
  <button type="submit">Validar e entrar</button>
</form>
</main>
</body>
</html>
